[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "intraday-trading"
version = "0.1.0"
description = "Automatic intraday trading simulation scaffold (paper trading/backtesting)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0,<3.0",
    "plotly>=5.0,<6.0",
    "streamlit>=1.36,<2.0",
]

[tool.setuptools.packages.find]
include = ["intraday_trading*"]
